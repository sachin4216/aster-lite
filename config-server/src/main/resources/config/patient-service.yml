server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/patient_db?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      # Without these, a request can wait up to 60 seconds for a stopped Redis before falling back to MySQL.
      timeout: 1s
      connect-timeout: 1s
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
    redis:
      time-to-live: 10m

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches