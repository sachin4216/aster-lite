services:
  mysql:
    image: mysql:8.4
    container_name: aster-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: aster-redis
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    container_name: aster-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  kafka:
    image: apache/kafka:4.1.0
    container_name: aster-kafka
    ports:
      - "9092:9092"    

volumes:
  mysql-data:
  mongo-data: